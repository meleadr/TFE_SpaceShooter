[project]
name = "spaceshooter"
version = "2.0.0"
description = "Vertical space shooter, a 2026 remaster of a 2019 school project (TFE)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "platformdirs>=4.14.8",
    "pygame-ce>=2.5.8",
]

[project.scripts]
spaceshooter = "spaceshooter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spaceshooter"]

[tool.ruff]
line-length = 100
target-version = "py312"  # the browser build (pygbag) runs Python 3.12
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pygbag>=0.9.3",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
